    .essentials [data-topic="effective-access"]{grid-column:1/3;justify-self:center;width:min(240px,100%)}

    .family-block[data-family="execution-family"]{--accent:var(--green)}
    .family-block[data-family="realtime-family"]{--accent:var(--amber)}

    tbody th{font-weight:600;white-space:nowrap}

    .not-found p{color:var(--muted);overflow-wrap:anywhere}
    .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}

        {"kind":"outcomes","heading":"Result and consequences","bullets":["The consumer can connect and query the approved view.","Unrelated base tables stay unavailable unless another grant authorizes them; validate view ownership and permissions on the target Warehouse.","Adding workspace Viewer would add broad inherited SQL reading and change this least-privilege result.","Inspect direct, workspace and group grants together when checking the effective result."]}
      ],
      "related":["warehouse","lh-delegated","item-access","effective-access"],"sources":["s7","s21","s2"]
    },
    {
      "id":"realtime-reader","label":"Real-Time reader","title":"Real-Time workspace reader",
      "summary":"Give an operations analyst Viewer access to a Real-Time workspace for KQL reading and inspection of streaming definitions.",
      "previewBullets":["Workspace Viewer maps to Kusto Viewer on the applicable items.","The analyst can inspect eventstream and schema-set definitions.","Editing, ingestion and business-event data operations need their own authorization."],
      "sections":[
        {"heading":"Workspace and task","paragraphs":["A Real-Time workspace contains an Eventhouse, KQL databases, eventstreams and event schema sets. An operations analyst needs read access across that workspace."]},
        {"kind":"grants","heading":"Permissions to assign","table":{"headers":["Scope / item","Assignment","What it enables"],"rows":[["Real-Time workspace","Viewer","View applicable workspace items"],["Eventhouse / KQL databases","Kusto Viewer inherited from workspace Viewer","Read permitted KQL data and metadata"],["Eventstreams","View inherited from workspace Viewer","Inspect stream definitions"],["Event schema sets","View inherited from workspace Viewer","Inspect schemas, versions and event types"],["Ingestion / business-event data","Assign a specific data role only when that action is required","Authorize the intended data action separately"]] }},
        {"kind":"outcomes","heading":"Result and consequences","bullets":["The analyst can query permitted KQL data and inspect the workspace's streaming definitions.","Kusto restricted-view policies and other applicable data rules determine the query result.","Viewer leaves creation, editing and deletion of those workspace items unavailable.","Publishing/consuming business events uses separate data roles. Add the required ingestion role for a producer instead of treating Viewer as an ingestion grant."]}
      ],
      "related":["kql-items","event-items","workspace-capabilities","realtime-family"],"sources":["s1","s14","s23","s24"]
    }
  ]
}
  </script>
  <script>
    "use strict";
    const data = JSON.parse(document.getElementById("atlas-data").textContent);
    const topics = new Map(data.topics.map(topic => [topic.id, topic]));
    const scenarios = new Map(data.scenarios.map(scenario => [scenario.id, scenario]));
    const children = new Map(data.topics.map(topic => [topic.id, []]));
    const edges = [];
    for (const topic of data.topics) {
      for (const parent of topic.parents) {
        if (!topics.has(parent)) throw new Error("Missing parent topic: " + parent);
        children.get(parent).push(topic.id);
        edges.push([parent, topic.id]);
      }
      for (const id of topic.sources) {
        if (!data.sources[id]) throw new Error("Missing documentation reference: " + id);
      }
    }
    const app = document.getElementById("app");
    const preview = document.getElementById("preview");
    let previewState = null;
    let dismissTimer = null;
    let graphObserver = null;
    let edgeFrame = null;
    let restoringPreviewFocus = false;
    let previewNeedsPointerMovement = false;
    const familyNames = {
      "lakehouse-family":"Lakehouse & OneLake","sql-family":"SQL data items","bi-family":"Power BI",
      "execution-family":"Execution","realtime-family":"Real-Time & IQ","other-items":"Other items"
    };

    function element(tag, className, text) {
      const el = document.createElement(tag);
      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;
      return el;
    }

    function localLink(kind, id, label, newTab = false, className = "") {
      const a = element("a", className, label);
      a.href = "#" + kind + "=" + encodeURIComponent(id);
      if (newTab) {
        a.target = "_blank";
        a.rel = "noopener noreferrer";
      }
      return a;
    }

    function sourceLink(id) {
      const source = data.sources[id];
      if (!source) throw new Error("Unknown documentation reference: " + id);
      const a = element("a", "", source.title + " \u2197");
      a.href = source.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.setAttribute("aria-label", source.title + " - Microsoft Learn, opens in a new tab");
      return a;
    }

    function inheritanceFor(item) {
      return item.inheritanceFrom ? topics.get(item.inheritanceFrom).inheritance : item.inheritance || [];
    }

    function sourceIds(item) {
      const support = oneLakeInfo(item);
      return [...new Set([...(support ? support.sources : []),
        ...inheritanceFor(item).flatMap(section => section.sources), ...item.sources])];
    }

    function oneLakeInfo(item) {
      const support = item.oneLake;
      if (!support) return null;
      const roles = {
        "supported":"Role authoring: supported.",
        "not-listed":"Role authoring: not listed for this item type.",
        "mixed":"Role authoring: varies by item type."
      };
      const filtering = {
        "supported":"RLS/CLS filtering: supported on this reading path.",
        "conditional":"RLS/CLS filtering: depends on the reading mode or engine.",
        "not-applied":"RLS/CLS filtering: not applied on this reading path."
      };
      const details = [];
      const sources = [];
      if (support.roles) {
        if (!Object.hasOwn(roles, support.roles)) throw new Error("Unknown OneLake role support: " + support.roles);
        details.push(roles[support.roles]);
        sources.push("s4");
      }
      if (support.filtering) {
        if (!Object.hasOwn(filtering, support.filtering)) throw new Error("Unknown OneLake filtering support: " + support.filtering);
        details.push(filtering[support.filtering]);
        sources.push("s6");
      }
      let label, state;
      if (support.roles === "supported") [label, state] = ["OL roles \u2713", "supported"];
      else if (support.filtering === "supported") [label, state] = ["OL RLS/CLS \u2713", "supported"];
      else if (support.filtering === "conditional") [label, state] = ["OL RLS/CLS: varies", "conditional"];
      else if (support.filtering === "not-applied") [label, state] = ["OL RLS/CLS \u2014", "unavailable"];
      else if (support.roles === "mixed") [label, state] = ["OL roles: varies", "conditional"];
      else if (support.roles === "not-listed") [label, state] = ["OL roles \u2014", "unavailable"];
      else throw new Error("OneLake support has no capability: " + item.id);
      return {label, state, description:[...details, support.note].join(" "), sources};
    }

    function renderOneLakeInfo(support) {
      const box = element("div", "onelake-info");
      box.append(element("strong", "", "OneLake security"), element("p", "", support.description));
      return box;
    }

    function ancestors(id) {
      const result = new Set();
      const visit = current => {
        for (const parent of topics.get(current).parents) {
          if (!result.has(parent)) {
            result.add(parent);
            visit(parent);
          }
        }
      };
      visit(id);
      return result;
    }

    function updateHighlight() {
      const id = previewState && previewState.kind === "topic" ? previewState.id : null;
      const parentIds = id ? ancestors(id) : new Set();
      for (const button of app.querySelectorAll(".node-button")) {
        const current = button.dataset.topic === id;
        button.classList.toggle("is-current", current);
        button.classList.toggle("is-ancestor", parentIds.has(button.dataset.topic));
        if (current) button.setAttribute("aria-describedby", "preview-summary" +
          (topics.get(id).oneLake ? " preview-onelake" : ""));
        else button.removeAttribute("aria-describedby");
      }
      for (const path of app.querySelectorAll(".graph-edge")) {
        const active = Boolean(id &&
          (path.dataset.to === id || parentIds.has(path.dataset.to)) &&
          parentIds.has(path.dataset.from));
        path.classList.toggle("is-active", active);
        if (active) path.parentNode.append(path);
      }
    }

    function clearDismiss() {
      if (dismissTimer !== null) clearTimeout(dismissTimer);
      dismissTimer = null;
    }

    function positionPreview() {
      if (preview.hidden || !previewState || !previewState.trigger.isConnected) return;
      const trigger = previewState.trigger.getBoundingClientRect();
      const margin = 12;
      preview.style.maxHeight = Math.max(100, innerHeight - margin * 2) + "px";
      const width = preview.getBoundingClientRect().width;
      let height = preview.getBoundingClientRect().height;
      let left = trigger.right + margin;
      let top;
      if (left + width <= innerWidth - margin && left >= margin) {
        top = trigger.top;
      } else if (trigger.left - width - margin >= margin) {
        left = trigger.left - width - margin;
        top = trigger.top;
      } else {
        const below = innerHeight - trigger.bottom - margin * 2;
        const above = trigger.top - margin * 2;
        const placeBelow = below >= height || below >= above;
        const available = placeBelow ? below : above;
        if (height > available) {
          preview.style.maxHeight = Math.max(100, available) + "px";
          height = preview.getBoundingClientRect().height;
        }
        left = (trigger.left + trigger.right - width) / 2;
        top = placeBelow ? trigger.bottom + margin : trigger.top - height - margin;
      }
      left = Math.max(margin, Math.min(left, innerWidth - width - margin));
      top = Math.max(margin, Math.min(top, innerHeight - height - margin));
      preview.style.left = left + "px";
      preview.style.top = top + "px";
    }

    function showPreview(kind, id, trigger) {
      const item = (kind === "topic" ? topics : scenarios).get(id);
      if (!item) throw new Error("Unknown preview target: " + id);
      clearDismiss();
      previewNeedsPointerMovement = false;
      previewState = {kind, id, trigger};
      document.getElementById("preview-title").textContent = item.title;
      document.getElementById("preview-summary").textContent = item.summary;
      const bullets = document.getElementById("preview-bullets");
      bullets.replaceChildren(...(item.previewBullets || []).map(text => element("li", "", text)));
      bullets.hidden = !bullets.childElementCount;
      const support = oneLakeInfo(item);
      const supportBox = document.getElementById("preview-onelake");
      supportBox.replaceChildren();
      supportBox.hidden = !support;
      if (support) supportBox.append(renderOneLakeInfo(support));
      const references = document.getElementById("preview-sources");
      references.replaceChildren(...sourceIds(item).slice(0, 3).map(sourceLink));
      document.getElementById("preview-hint").textContent = kind === "topic" ?
        "Click to open the full topic." : "Click to open the full scenario.";
      preview.hidden = false;
      updateHighlight();
      positionPreview();
    }

    function hidePreview(restoreFocus = false) {
      clearDismiss();
      const previous = previewState;
      previewState = null;
      preview.hidden = true;
      previewNeedsPointerMovement = true;
      updateHighlight();
      if (restoreFocus && previous && previous.trigger.isConnected) {
        restoringPreviewFocus = true;
        previous.trigger.focus({preventScroll:true});
        restoringPreviewFocus = false;
      }
    }

    function scheduleDismiss() {
      clearDismiss();
      dismissTimer = setTimeout(() => {
        if (!previewState) return;
        const trigger = previewState.trigger;
        const focused = document.activeElement;
        const keyboardFocus = focused && focused.matches(":focus-visible") &&
          (preview.contains(focused) || trigger === focused);
        if (preview.matches(":hover") || trigger.matches(":hover") || keyboardFocus) return;
        hidePreview();
      }, 220);
    }

    function bindPreview(trigger, kind, id) {
      trigger.addEventListener("pointerenter", event => {
        if (event.pointerType === "touch" || previewNeedsPointerMovement) return;
        showPreview(kind, id, trigger);
      });
      trigger.addEventListener("pointermove", event => {
        if (event.pointerType !== "touch" && previewNeedsPointerMovement && (event.movementX || event.movementY)) {
          showPreview(kind, id, trigger);
        }
      });
      trigger.addEventListener("pointerleave", scheduleDismiss);
      trigger.addEventListener("focus", () => {
        if (!restoringPreviewFocus && trigger.matches(":focus-visible")) {
          trigger.scrollIntoView({block:"nearest", inline:"nearest"});
          showPreview(kind, id, trigger);
          // Keyboard scrolling can move another node under a stationary pointer.
          previewNeedsPointerMovement = true;
        }
      });
      trigger.addEventListener("blur", scheduleDismiss);
    }

    function nodeLink(id, familyRoot = false) {
      const topic = topics.get(id);
      if (!topic) throw new Error("Unknown map topic: " + id);
      const link = localLink("topic", id, undefined, true, "node-button" + (familyRoot ? " family-root" : ""));
      link.append(element("span", "node-label", topic.label));
      const support = oneLakeInfo(topic);
      if (support) {
        const badge = element("span", "onelake-badge " + support.state, support.label);
        badge.setAttribute("aria-hidden", "true");
        link.append(badge);
      }
      link.dataset.topic = id;
      link.setAttribute("aria-label", "Open " + topic.label + " in a new tab");
      bindPreview(link, "topic", id);
      return link;
    }

    function renderBranch(id, familyRoot = false) {
      const branch = element("div", "branch");
      branch.append(nodeLink(id, familyRoot));
      const next = children.get(id);
      if (next.length) {
        const list = element("div", id === "lakehouse-family" ? "route-split" :
          "branch-children" + (next.length === 1 ? " single-child" : ""));
        for (const child of next) list.append(renderBranch(child));
        branch.append(list);
      }
      return branch;
    }

    function drawEdges() {
      const canvas = app.querySelector(".graph-canvas");
      const svg = app.querySelector(".graph-lines");
      if (!canvas || !svg) return;
      const outer = canvas.getBoundingClientRect();
      const positions = new Map();
      for (const node of canvas.querySelectorAll(".node-button")) {
        const r = node.getBoundingClientRect();
        positions.set(node.dataset.topic, {
          left:r.left-outer.left,right:r.right-outer.left,top:r.top-outer.top,bottom:r.bottom-outer.top,
          cx:(r.left+r.right)/2-outer.left,cy:(r.top+r.bottom)/2-outer.top
        });
      }
      svg.setAttribute("viewBox", "0 0 " + canvas.clientWidth + " " + canvas.clientHeight);
      svg.replaceChildren();
      for (const [from, to] of edges) {
        const a = positions.get(from);
        const b = positions.get(to);
        if (!a || !b) throw new Error("Map edge is missing a rendered node: " + from + " -> " + to);
        let d;
        if (data.map.essentials.includes(from) || from === "lakehouse-family") {
          const middle = a.bottom + (b.top-a.bottom)/2;
          d = `M ${a.cx} ${a.bottom} V ${middle} H ${b.cx} V ${b.top}`;
        } else if (children.get(from).length === 1) {
          d = `M ${a.cx} ${a.bottom} V ${b.top}`;
        } else {
          const spine = b.left - 10;
          d = `M ${a.cx} ${a.bottom} V ${a.bottom+12} H ${spine} V ${b.cy} H ${b.left}`;
        }
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("d", d);
        path.setAttribute("class", "graph-edge");
        path.dataset.from = from;
        path.dataset.to = to;
        svg.append(path);
      }
      updateHighlight();
    }

    function queueEdges() {
      if (edgeFrame !== null) cancelAnimationFrame(edgeFrame);
      edgeFrame = requestAnimationFrame(() => {
        edgeFrame = null;
        drawEdges();
      });
    }

    function renderOverview(scrollToScenarios) {
      document.title = data.name;
      app.dataset.view = "overview";
      previewNeedsPointerMovement = false;
      const intro = element("section", "intro");
      intro.append(element("p", "eyebrow", "Microsoft Fabric - Customer reference"),
        element("h1", "", data.name),
        element("p", "intro-lead", "Simplify Microsoft Fabric access decisions. Explore workspace roles, item permissions and data access paths, then find a practical starting point for your scenario."));
      const actions = element("nav", "intro-actions");
      actions.setAttribute("aria-label", "Get started");
      const scenariosLink = element("a", "", "Find your scenario");
      scenariosLink.href = "#scenarios";
      actions.append(scenariosLink, localLink("topic", "effective-access", "Understand the access model"));
      intro.append(actions, element("p", "intro-privacy", "Runs locally in your browser. No sign-in, tenant connection or data collection."));
      const card = element("section", "map-card");
      card.setAttribute("aria-label", "Fabric access diagram");
      const mapHeading = element("div", "map-heading");
      const mapHelp = element("p", "", "Follow the map from identity to an item family. Hover or focus for a preview; open a card for full guidance in a new tab. Scroll the map sideways on smaller screens.");
      mapHelp.id = "map-help";
      mapHeading.append(element("h2", "", "Follow the access path"), mapHelp);
      const viewport = element("div", "map-viewport");
      viewport.tabIndex = 0;
      viewport.setAttribute("role", "region");
      viewport.setAttribute("aria-label", "Access map; scroll horizontally to explore all six item families");
      viewport.setAttribute("aria-describedby", "map-help");
      const canvas = element("div", "graph-canvas");
      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("class", "graph-lines");
      svg.setAttribute("aria-hidden", "true");
      const essentials = element("div", "essentials");
      for (const id of data.map.essentials) {
        const node = nodeLink(id);
        if (id === "identity") node.classList.add("identity-node");
        if (id === "effective-access") node.classList.add("effective-node");
        essentials.append(node);
      }
      const families = element("div", "family-grid");
      for (const id of data.map.families) {
        const family = element("section", "family-block");
        family.dataset.family = id;
        family.setAttribute("aria-label", familyNames[id]);
        family.append(renderBranch(id, true));
        families.append(family);
      }
      canvas.append(svg, essentials, families);
      viewport.append(canvas);
      const legend = element("details", "map-legend");
      legend.append(element("summary", "", "Map legend and permission terms"));
      const terms = element("dl");
      for (const [term, definition] of [
        ["OL", "OneLake. Badges distinguish role authoring from filtering on a reading path."],
        ["RLS / CLS / OLS", "Row-level, column-level and object-level security."],
        ["Read", "Item entry or consumption; the exact capability depends on the item type."],
        ["ReadData", "Broad SQL reading on the applicable data item or endpoint."],
        ["ReadAll", "OneLake / Spark reading, subject to the item's data-access rules."],
        ["Build", "Create and explore semantic-model content; not a substitute for data security."],
        ["Badge states", "A check mark indicates support; varies means conditional support; a dash means not applied or not listed. Open the topic for the distinction."]
      ]) terms.append(element("dt", "", term), element("dd", "", definition));
      legend.append(terms);
      card.append(mapHeading, viewport, legend);
      const scenarioSection = element("section", "scenarios");
      scenarioSection.id = "scenarios";
      const scenarioHeading = element("div", "section-heading");
      scenarioHeading.append(element("h2", "", "Frequent permission scenarios"));
      const grid = element("div", "scenario-grid");
      for (const scenario of data.scenarios) {
        const a = localLink("scenario", scenario.id, undefined, true, "scenario-card");
        a.setAttribute("aria-label", "Open " + scenario.title + " in a new tab");
        a.append(element("span", "", scenario.title), element("span", "external-icon"));
        a.lastChild.setAttribute("aria-hidden", "true");
        bindPreview(a, "scenario", scenario.id);
        grid.append(a);
      }
      scenarioSection.append(scenarioHeading, grid);
      app.append(intro, card, scenarioSection, renderReferenceFooter());
      viewport.scrollLeft = Math.max(0, (canvas.clientWidth - viewport.clientWidth)/2);
      graphObserver = new ResizeObserver(queueEdges);
      graphObserver.observe(canvas);
      queueEdges();
      if (scrollToScenarios) requestAnimationFrame(() => scenarioSection.scrollIntoView({block:"start"}));
    }

    function renderTable(spec) {
      const wrap = element("div", "table-scroll");
      const table = element("table");
      if (spec.caption) table.append(element("caption", "", spec.caption));
      const head = element("thead");
      const row = element("tr");
      for (const label of spec.headers) {
        const th = element("th", "", label);
        th.scope = "col";
        row.append(th);
      }
      head.append(row);
      const body = element("tbody");
      for (const values of spec.rows) {
        if (values.length !== spec.headers.length) throw new Error("Table row does not match its headings");
        const tr = element("tr");
        values.forEach((value, index) => {
          const cell = element(index === 0 ? "th" : "td");
          if (index === 0) cell.scope = "row";
          if (typeof value === "boolean") {
            cell.textContent = value ? "Yes" : "No";
            cell.className = value ? "cell-yes" : "cell-no";
          } else cell.textContent = value;
          tr.append(cell);
        });
        body.append(tr);
      }
      table.append(head, body);
      wrap.append(table);
      return wrap;
    }

    function renderSections(sections, headingLevel = "h2") {
      const fragment = document.createDocumentFragment();
      for (const spec of sections) {
        const section = element("section", "article-section");
        section.append(element(headingLevel, "", spec.heading));
        for (const paragraph of spec.paragraphs || []) section.append(element("p", "", paragraph));
        if (spec.bullets) {
          const list = element("ul");
          for (const bullet of spec.bullets) list.append(element("li", "", bullet));
          section.append(list);
        }
        if (spec.table) section.append(renderTable(spec.table));
        if (spec.note) section.append(element("div", "article-note", spec.note));
        if (spec.sources) {
          const links = element("div", "inheritance-sources");
          links.append(...spec.sources.map(sourceLink));
          section.append(links);
        }
        fragment.append(section);
      }
      return fragment;
    }

    function renderReferenceFooter() {
      const footer = element("footer", "atlas-footer");
      footer.append(element("p", "", "Reference snapshot: " + data.reviewed + ". Features, preview availability and permission behavior can change. Consult each topic's Microsoft Learn sources and validate access with the intended consumer identity."),
        element("p", "", "This field reference is not official Microsoft product documentation. Provided as is, without warranty, production support or service-level commitments."));
      const link = element("a", "", "Repository disclaimer");
      link.href = "https://github.com/microsoft/NLCSU/blob/main/DISCLAIMER.md";
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      footer.append(link);
      return footer;
    }

    function renderArticle(kind, id, item) {
      app.dataset.view = kind;
      app.dataset.entry = id;
      document.title = item.title + " | " + data.name;
      const article = element("article", "article");
      const breadcrumb = element("nav", "breadcrumbs");
      breadcrumb.setAttribute("aria-label", "Breadcrumb");
      const home = element("a", "", "Atlas");
      home.href = "#";
      breadcrumb.append(home, element("span", "", "/"));
      if (kind === "scenario") {
        const link = element("a", "", "Scenarios");
        link.href = "#scenarios";
        breadcrumb.append(link, element("span", "", "/"));
      } else if (item.family && item.family !== item.id) {
        breadcrumb.append(localLink("topic", item.family, familyNames[item.family]), element("span", "", "/"));
      }
      breadcrumb.append(element("span", "", item.label));
      const top = element("div", "article-top");
      const topBack = element("a", "article-back", "Back to access map");
      topBack.href = "#";
      top.append(breadcrumb, topBack);
      article.append(top, element("h1", "", item.title), element("p", "article-lead", item.summary));
      const body = element("div", "article-body");
      const support = oneLakeInfo(item);
      if (support) body.append(renderOneLakeInfo(support));
      const inherited = inheritanceFor(item);
      if (inherited.length) {
        const section = element("section", "inheritance");
        section.append(element("h2", "", "Workspace inheritance"));
        if (item.inheritanceFrom) {
          const owner = topics.get(item.inheritanceFrom);
          const scope = element("p");
          scope.append(document.createTextNode("This route uses the permissions of "), localLink("topic", owner.id, owner.label), document.createTextNode("."));
          section.append(scope);
        }
        section.append(renderSections(inherited, "h3"));
        body.append(section);
      }
      body.append(renderSections(item.sections));
      const next = new Set(kind === "topic" ? children.get(id) : []);
      for (const related of item.related) next.add(related);
      next.delete(id);
      if (next.size) {
        const section = element("section", "article-section");
        section.append(element("h2", "", "Continue exploring"));
        const grid = element("div", "related-grid");
        for (const related of next) {
          const topic = topics.get(related);
          if (!topic) throw new Error("Unknown related topic: " + related);
          grid.append(localLink("topic", related, topic.title, false, "related-link"));
        }
        section.append(grid);
        body.append(section);
      }
      const references = element("section", "topic-sources");
      references.append(element("h2", "", "Microsoft Learn"));
      const sourceList = element("ul");
      for (const source of sourceIds(item)) {
        const li = element("li");
        li.append(sourceLink(source));
        sourceList.append(li);
      }
      references.append(sourceList);
      body.append(references);
      const footer = element("div", "article-footer");
      const back = element("a", "", "Back to access map");
      back.href = "#";
      footer.append(back);
      article.append(body, footer, renderReferenceFooter());
      app.append(article);
    }

    function renderNotFound() {
      app.dataset.view = "not-found";
      document.title = "Topic not found | " + data.name;
      const section = element("section", "not-found");
      section.setAttribute("role", "alert");
      section.append(element("p", "eyebrow", "Unknown reference"), element("h1", "", "Topic not found"),
        element("p", "", "This local link does not identify a topic or scenario in this copy of the Atlas."));
      const link = element("a", "", "Return to the access map");
      link.href = "#";
      section.append(link);
      app.append(section);
    }

    function renderRoute() {
      hidePreview();
      if (graphObserver) graphObserver.disconnect();
      if (edgeFrame !== null) cancelAnimationFrame(edgeFrame);
      edgeFrame = null;
      app.replaceChildren();
      delete app.dataset.entry;
      const hash = location.hash.slice(1);
      const home = !hash || hash === "scenarios" || hash === "questions";
      if (home) {
        renderOverview(Boolean(hash));
      } else {
        const params = new URLSearchParams(hash);
        const entries = Array.from(params.entries());
        let kind = entries.length === 1 ? entries[0][0] : "";
        let id = entries.length === 1 ? entries[0][1] : "";
        const legacyQuestions = {
          "example-item-only":["topic","item-access"],
          "example-data-execution":["scenario","run-approved-work"],
          "example-model-build":["topic","semantic-model"],
          "example-viewer":["topic","workspace-capabilities"],
          "example-read":["topic","item-access"],
          "example-link":["topic","item-access"]
        };
        if (kind === "question" && Object.hasOwn(legacyQuestions, id)) [kind, id] = legacyQuestions[id];
        if (kind === "topic" && id === "family-hub") id = "effective-access";
        const registry = kind === "topic" ? topics : kind === "scenario" ? scenarios : null;
        if (!registry || !registry.has(id)) renderNotFound();
        else renderArticle(kind, id, registry.get(id));
      }
      if (hash !== "scenarios" && hash !== "questions") window.scrollTo(0, 0);
    }

    preview.addEventListener("pointerenter", clearDismiss);
    preview.addEventListener("pointerleave", scheduleDismiss);
    preview.addEventListener("focusin", clearDismiss);
    preview.addEventListener("focusout", scheduleDismiss);
    document.addEventListener("pointerdown", event => {
      if (preview.hidden || preview.contains(event.target) || event.target.closest(".node-button,.scenario-card")) return;
      hidePreview();
    });
    document.addEventListener("keydown", event => {
      if (event.key === "Escape" && !preview.hidden) {
        event.preventDefault();
        hidePreview(true);
      }
    });
    window.addEventListener("hashchange", renderRoute);
    window.addEventListener("resize", () => { queueEdges(); positionPreview(); });
    window.addEventListener("scroll", positionPreview, {capture:true, passive:true});
    renderRoute();
  </script>
</body>
</html>
